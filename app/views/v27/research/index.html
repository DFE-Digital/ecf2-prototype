{% extends "layouts/ects.html" %}

{% block pageTitle %}Choose an option{% endblock %}

{% block content %}
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      <h1 class="govuk-heading-l">Choose an option</h1>
      <p class="govuk-body">Your researcher will tell you which option to open.</p>

      <ul class="govuk-list">
        {% for option in options %}
          <li>
            <a href="{{ option.href }}" role="button" draggable="false" class="govuk-button govuk-button--secondary govuk-!-margin-bottom-2" data-module="govuk-button">
              Option {{ option.letter }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
{% endblock %}
